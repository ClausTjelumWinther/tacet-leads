<title>Tacet Puls</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: én kolonne på mobil; på desktop "I dag" som smal hovedspalte med pipeline ved siden af. Rækker, ikke kort. */
:root{
  --bg:#F3F5F2; --surface:#FFFFFF; --ink:#151B19; --muted:#5D6965; --line:#DCE2DE;
  --accent:#1E5B48; --accent-soft:#E2EEE8; --warn:#B4400B; --warn-soft:#FBEADF;
  --ok:#2D6A3A; --velatir:#4B3FA8; --velatir-soft:#ECEAFB;
  --f-display:"Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", Roboto, Arial, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1312; --surface:#161D1B; --ink:#E6ECE9; --muted:#93A19C; --line:#28322F;
  --accent:#6CCBA8; --accent-soft:#1B2E28; --warn:#F2915F; --warn-soft:#3A2218;
  --ok:#7FCB8E; --velatir:#A9A0F5; --velatir-soft:#25223F; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0E1312; --surface:#161D1B; --ink:#E6ECE9; --muted:#93A19C; --line:#28322F;
  --accent:#6CCBA8; --accent-soft:#1B2E28; --warn:#F2915F; --warn-soft:#3A2218;
  --ok:#7FCB8E; --velatir:#A9A0F5; --velatir-soft:#25223F; color-scheme:dark }

body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);margin:0}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible,.row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;gap:2px}
.brand h1{font-size:28px;letter-spacing:-.01em;line-height:1.1}
.brand .date{color:var(--muted);font-size:13px}
.pulse{display:flex;flex-wrap:wrap;gap:8px 20px}
.pulse div{display:flex;flex-direction:column}
.pulse b{font-family:var(--f-mono);font-weight:500;font-size:20px;font-variant-numeric:tabular-nums}
.pulse span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pulse .hot b{color:var(--warn)}
.tools{display:flex;gap:8px;align-items:center;margin-left:auto}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:13px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.btn:disabled{opacity:.5;cursor:default}

nav.tabs{display:flex;gap:4px;overflow-x:auto;margin:16px 0 8px;padding-bottom:2px}
nav.tabs button{border:0;background:none;padding:8px 12px;border-radius:999px;font-size:14px;color:var(--muted);white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
nav.tabs .n{font-family:var(--f-mono);font-size:12px;margin-left:6px;opacity:.75}
.search{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px;font:inherit;color:var(--ink);margin-bottom:8px}

.grid{display:grid;gap:28px;grid-template-columns:1fr}
@media (min-width:900px){ .grid.split{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)} }
section.group{display:flex;flex-direction:column;gap:0;min-width:0}
.ghead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:16px 0 6px;border-bottom:1px solid var(--ink)}
.ghead h2{font-size:17px}
.ghead small{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.ghead.warn{border-bottom-color:var(--warn)} .ghead.warn h2{color:var(--warn)}
.empty{color:var(--muted);font-size:14px;padding:12px 0}

.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer;min-width:0}
.row:hover .who{color:var(--accent)}
.who{font-weight:600;display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-width:0}
.who .person{font-weight:400;color:var(--muted)}
.next{grid-column:1/2;color:var(--ink);font-size:14px;min-width:0;overflow-wrap:anywhere}
.next.none{color:var(--muted);font-style:italic}
.side{grid-row:1/3;grid-column:2;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.when{font-family:var(--f-mono);font-size:12px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.when.over{background:var(--warn-soft);color:var(--warn)}
.when.nodate{background:transparent;color:var(--muted);border:1px dashed var(--line)}
.val{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.pill{font-size:11px;letter-spacing:.04em;text-transform:uppercase;padding:1px 7px;border-radius:4px;border:1px solid var(--line);color:var(--muted);font-weight:500}
.pill.v{border-color:transparent;background:var(--velatir-soft);color:var(--velatir)}

/* Fokuskort: én person eller ét projekt ad gangen */
.focus{display:flex;flex-direction:column;gap:20px;padding-top:8px}
.back{border:0;background:none;color:var(--accent);padding:4px 0;font-size:14px;align-self:flex-start}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.fname{font-size:clamp(28px,6vw,42px);letter-spacing:-.015em;line-height:1.05;margin-top:4px}
.fsub{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;color:var(--muted);margin-top:8px}
.fgrid{display:grid;gap:24px;grid-template-columns:1fr}
@media (min-width:900px){ .fgrid{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)} }
.fmain,.fside{display:flex;flex-direction:column;gap:24px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.sec{font-family:var(--f-body);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.bignext{font-family:var(--f-display);font-size:21px;font-weight:600;line-height:1.3;margin:0}
.bignext.none{color:var(--muted);font-weight:500}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:6.2em minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;overflow-wrap:anywhere}
.tl .d{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:2px}
.facts{display:flex;flex-direction:column;gap:6px;font-size:14px}
.facts div{display:flex;justify-content:space-between;gap:12px}
.facts span:first-child{color:var(--muted)}
.flash{font-size:13px;padding:8px 12px;border-radius:8px;background:var(--accent-soft);color:var(--accent)}
.flash.err{background:var(--warn-soft);color:var(--warn)}
.kv{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px}
.kv .sel{user-select:all;font-family:var(--f-mono);font-size:13px}
.copy{border:0;background:none;color:var(--accent);font-size:12px;padding:0 4px}
.notes{white-space:pre-wrap;font-size:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;max-height:220px;overflow:auto;overflow-wrap:anywhere}
.acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.acts .lbl{font-size:12px;color:var(--muted);margin-right:4px}
textarea{width:100%;box-sizing:border-box;min-height:72px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:inherit;background:var(--surface);color:var(--ink);resize:vertical}
.status{font-size:13px;color:var(--muted);min-height:1em}
.status.err{color:var(--warn)} .status.okk{color:var(--ok)}

.banner{border:1px solid var(--warn);background:var(--warn-soft);color:var(--ink);border-radius:8px;padding:12px 14px;margin-top:16px;font-size:14px}
.loading{padding:40px 0;color:var(--muted)}
.loading b{display:block;font-family:var(--f-display);font-size:20px;color:var(--ink);margin-bottom:4px}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin:4px 0}
.foot{margin-top:28px;font-size:12px;color:var(--muted);font-family:var(--f-mono)}
@media (prefers-reduced-motion:no-preference){ .row{transition:background .15s} }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Puls</h1>
      <div class="date" id="today"></div>
    </div>
    <div class="pulse" id="pulse" aria-live="polite"></div>
    <div class="tools">
      <button class="btn" id="refresh" type="button">Opdatér</button>
    </div>
  </header>

  <div id="banner" class="banner" hidden></div>

  <nav class="tabs" role="tablist" id="tabs"></nav>
  <input class="search" id="q" type="search" placeholder="Søg i firma, person eller næste skridt" autocomplete="off">

  <main id="main">
    <div class="loading"><b>Henter dine leads</b>Siden læser direkte fra Supabase gennem din egen forbindelse. Første gang spørger Claude, om siden må bruge den.</div>
  </main>

  <div class="foot" id="foot"></div>
</div>

<script>
(function(){
  const SERVER = "Supabase", TOOL = "execute_sql", PROJECT = "vdebqppfkvcqjytbuhny";
  const STAGES = {tilbud:"Tilbud",dialog:"Dialog",lead:"Lead",kunde:"Kunde",netvaerk:"Netværk",tabt:"Tabt"};
  const ACTIVE = ["tilbud","dialog","lead"];
  const TABS = [["idag","I dag"],["pipeline","Pipeline"],["netvaerk","Netværk"],["velatir","Velatir"],["personer","Personer"]];
  const $ = s => document.querySelector(s);
  let mcp = null, data = null, tab = "idag", focus = null, flash = null, listScroll = 0, showPrivate = false, query = "";

  try { const t = localStorage.getItem("puls.tab"); if (t && TABS.some(x=>x[0]===t)) tab = t; } catch(e){}

  const fmtDay = new Intl.DateTimeFormat("sv-SE",{timeZone:"Europe/Copenhagen"});
  const today = () => fmtDay.format(new Date());
  const addDays = (iso,n) => { const d = new Date(iso+"T12:00:00Z"); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); };
  const diff = (iso) => Math.round((new Date(iso+"T12:00:00Z") - new Date(today()+"T12:00:00Z"))/864e5);
  const dk = (iso) => { const [y,m,d] = iso.split("-"); return `${+d}/${+m}`; };
  const stamp = () => { const [y,m,d] = today().split("-"); return `${d}/${m}/${y}`; };
  const kr = n => n==null ? "" : new Intl.NumberFormat("da-DK").format(n)+" kr.";
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const isId = s => /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/.test(s);
  const lit = t => { let tag; do { tag = "q" + Math.random().toString(36).slice(2,8); } while (t.includes("$"+tag+"$")); return `$${tag}$${t}$${tag}$`; };

  $("#today").textContent = new Intl.DateTimeFormat("da-DK",{timeZone:"Europe/Copenhagen",weekday:"long",day:"numeric",month:"long"}).format(new Date());

  function whenChip(iso){
    if (!iso) return `<span class="when nodate">uden dato</span>`;
    const n = diff(iso);
    if (n < 0) return `<span class="when over">${-n} ${-n===1?"dag":"dage"} over</span>`;
    if (n === 0) return `<span class="when">i dag</span>`;
    if (n === 1) return `<span class="when">i morgen</span>`;
    if (n < 7) return `<span class="when">${new Intl.DateTimeFormat("da-DK",{weekday:"short",timeZone:"UTC"}).format(new Date(iso+"T12:00:00Z")).replace(".","")} ${dk(iso)}</span>`;
    return `<span class="when">${dk(iso)}</span>`;
  }

  function errText(e){
    const c = e && e.code;
    switch(c){
      case "server_not_connected": case "server_not_found": return "Supabase er ikke forbundet til din konto. Tilføj den under Indstillinger → Connectors i claude.ai, og opdatér siden.";
      case "needs_reauth": return "Forbindelsen til Supabase er udløbet. Forbind den igen under Indstillinger → Connectors i claude.ai.";
      case "selection_required": return "Du har flere Supabase-forbindelser. Vælg den rigtige i dialogen fra Claude, og opdatér siden.";
      case "not_in_manifest": return "Siden har ikke lov til at bruge Supabase. Giv adgang i sidens tilladelser og opdatér.";
      case "blocked_by_policy": case "approval_required": return "Din organisation tillader ikke, at siden bruger Supabase.";
      case "server_unavailable": return "Supabase svarer ikke lige nu. Prøv Opdatér om lidt.";
      case "tool_error": return "Databasen afviste forespørgslen: " + (e.message || "ukendt fejl");
      case "not_granted": case "capability_disabled": case "capability_removed": return "Siden kan ikke hente data i denne visning. Åbn den i claude.ai.";
      default: return (e && e.message) ? "Noget gik galt: " + e.message : "Noget gik galt. Prøv Opdatér.";
    }
  }

  function parseRows(payload){
    if (Array.isArray(payload)) return payload;
    let s = typeof payload === "string" ? payload : (payload && typeof payload.result === "string" ? payload.result : null);
    if (s == null) { if (payload && Array.isArray(payload.result)) return payload.result; throw {message:"Uventet svar fra Supabase"}; }
    const close = s.indexOf("</untrusted-data-");
    if (close >= 0){
      const openTag = s.lastIndexOf("<untrusted-data-", close);
      const gt = s.indexOf(">", openTag);
      return JSON.parse(s.slice(gt + 1, close).trim());
    }
    const start = s.search(/[\[{]/);
    return JSON.parse(start >= 0 ? s.slice(start) : s);
  }

  async function sql(query){
    const res = await mcp.callTool(SERVER, TOOL, {project_id: PROJECT, query}, {cache:false});
    return parseRows(res.payload !== undefined ? res.payload : (res.content && res.content[0] && res.content[0].text));
  }

  const LOAD = `select json_build_object(
    'p',(select coalesce(json_agg(x),'[]'::json) from (select p.id,p.virksomhed_id as vid,p.produkt,p.stage,p.vaerdi,p.naeste_skridt,p.naeste_skridt_dato,p.noter,p.velatir,v.firmanavn,v.kontaktperson,v.email,v.mobilnummer from projekter p left join virksomheder v on v.id=p.virksomhed_id) x),
    'pe',(select coalesce(json_agg(x),'[]'::json) from (select pe.id,pe.virksomhed_id as vid,pe.navn,pe.kategori,pe.email,pe.mobilnummer,pe.noter,pe.sidste_kontakt,v.firmanavn from personer pe left join virksomheder v on v.id=pe.virksomhed_id) x),
    'o',(select coalesce(json_agg(x),'[]'::json) from (select o.id,o.tekst,o.forfald,pe.navn as person,v.firmanavn as firma from opgaver o left join personer pe on pe.id=o.person_id left join projekter p on p.id=o.projekt_id left join virksomheder v on v.id=p.virksomhed_id where not o.faerdig) x)
  ) as d`;

  let retried = false;
  async function load(){
    const btn = $("#refresh"); btn.disabled = true; btn.textContent = "Henter…";
    try {
      const rows = await sql(LOAD);
      const d = rows[0] && rows[0].d;
      data = { p: d.p || [], pe: d.pe || [], o: d.o || [] };
      $("#banner").hidden = true; retried = false;
      $("#foot").textContent = "Hentet " + new Intl.DateTimeFormat("da-DK",{timeZone:"Europe/Copenhagen",hour:"2-digit",minute:"2-digit"}).format(new Date()) + " · direkte fra Supabase";
      render();
    } catch(e){
      if (e && e.retryable && !retried){ retried = true; setTimeout(load, (e.retryAfterMs || 1500) + Math.random()*800); return; }
      const b = $("#banner"); b.textContent = errText(e); b.hidden = false;
      if (!data) $("#main").innerHTML = "";
    } finally { btn.disabled = false; btn.textContent = "Opdatér"; }
  }

  // Afledte lister
  const projName = p => p.firmanavn ? p.firmanavn.trim() : p.produkt;
  function matches(...fields){ if (!query) return true; const q = query.toLowerCase(); return fields.some(f => f && String(f).toLowerCase().includes(q)); }
  function projects(filter){ return data.p.filter(filter).filter(p => matches(p.firmanavn,p.kontaktperson,p.naeste_skridt,p.produkt)); }
  const byDate = (a,b) => (a.naeste_skridt_dato||"9999") < (b.naeste_skridt_dato||"9999") ? -1 : 1;

  function renderPulse(){
    const t = today();
    const live = data.p.filter(p => p.stage !== "tabt");
    const over = live.filter(p => p.naeste_skridt_dato && p.naeste_skridt_dato < t).length + data.o.filter(o => o.forfald && o.forfald < t).length;
    const week = live.filter(p => p.naeste_skridt_dato && p.naeste_skridt_dato >= t && p.naeste_skridt_dato <= addDays(t,6)).length;
    const pipe = data.p.filter(p => p.stage==="tilbud"||p.stage==="dialog").reduce((s,p)=>s+(p.vaerdi||0),0);
    $("#pulse").innerHTML =
      `<div class="${over?"hot":""}"><b>${over}</b><span>Forfaldne</span></div>
       <div><b>${week}</b><span>Næste 7 dage</span></div>
       <div><b>${data.o.length}</b><span>Løfter</span></div>
       <div><b>${new Intl.NumberFormat("da-DK",{notation:"compact",maximumFractionDigits:0}).format(pipe)}</b><span>I spil, kr.</span></div>`;
  }

  function renderTabs(){
    const t = today();
    const counts = {
      idag: data.p.filter(p => p.stage!=="tabt" && p.naeste_skridt_dato && p.naeste_skridt_dato <= addDays(t,6)).length + data.o.length,
      pipeline: data.p.filter(p => ACTIVE.includes(p.stage)).length,
      netvaerk: data.p.filter(p => p.stage==="netvaerk").length + data.pe.filter(x => x.kategori==="netvaerk").length,
      velatir: data.p.filter(p => p.velatir).length,
      personer: data.pe.filter(x => showPrivate || x.kategori !== "privat").length
    };
    $("#tabs").innerHTML = TABS.map(([k,l]) => `<button type="button" role="tab" data-tab="${k}" aria-selected="${k===tab}">${l}<span class="n">${counts[k]}</span></button>`).join("");
  }

  // ---------- Rækker i listerne ----------
  function projRow(p){
    const meta = [p.stage!=="netvaerk" ? `<span class="pill">${STAGES[p.stage]||esc(p.stage)}</span>` : "", p.velatir ? `<span class="pill v">Velatir</span>` : ""].join("");
    return `<div class="row" tabindex="0" role="button" data-focus="p:${p.id}">
      <div class="who">${esc(projName(p))}${p.kontaktperson?`<span class="person">· ${esc(p.kontaktperson.trim())}</span>`:""}${meta}</div>
      <div class="side">${whenChip(p.naeste_skridt_dato)}${p.vaerdi?`<span class="val">${kr(p.vaerdi)}</span>`:""}</div>
      <div class="next ${p.naeste_skridt?"":"none"}">${esc(p.naeste_skridt || "Intet næste skridt")}</div>
    </div>`;
  }

  const KAT = {privat:"Privat", netvaerk:"Netværk", kunde:"Kunde"};
  function personRow(x){
    const sub = x.firmanavn ? `<span class="person">· ${esc(x.firmanavn.trim())}</span>` : "";
    const last = x.sidste_kontakt ? `Talt sammen ${dk(x.sidste_kontakt)}` : "Ingen kontakt registreret";
    const first = (x.noter||"").split("\n")[0];
    return `<div class="row" tabindex="0" role="button" data-focus="pe:${x.id}">
      <div class="who">${esc(x.navn)}${sub}<span class="pill">${KAT[x.kategori]||esc(x.kategori)}</span></div>
      <div class="side"><span class="val">${esc(last)}</span></div>
      <div class="next ${first?"":"none"}">${esc(first || "Ingen noter endnu")}</div>
    </div>`;
  }

  function taskRow(o){
    const who = o.person || (o.firma && o.firma.trim()) || "";
    return `<div class="row" style="cursor:default">
      <div class="who">${esc(o.tekst)}</div>
      <div class="side">${whenChip(o.forfald)}<button class="btn" type="button" data-done="${o.id}">Færdig</button></div>
      <div class="next ${who?"":"none"}">${esc(who || "Uden person")}</div>
    </div>`;
  }

  function group(title, rows, opts={}){
    return `<section class="group"><div class="ghead ${opts.warn?"warn":""}"><h2>${title}</h2><small>${rows.length}</small></div>
      ${rows.length ? rows.join("") : `<div class="empty">${opts.empty || "Intet her."}</div>`}</section>`;
  }

  function contact(email, phone){
    const parts = [];
    if (email) parts.push(`<div><span class="sel">${esc(email)}</span><button class="copy" type="button" data-copy="${esc(email)}">Kopiér</button></div>`);
    if (phone) parts.push(`<div><span class="sel">${esc(phone.trim())}</span><button class="copy" type="button" data-copy="${esc(phone.trim())}">Kopiér</button></div>`);
    return parts.length ? `<div class="kv" style="flex-direction:column">${parts.join("")}</div>` : `<div class="empty" style="padding:0">Ingen kontaktoplysninger endnu.</div>`;
  }

  // Noter er skrevet som "DD/MM/YYYY: tekst", nyeste øverst. Vis dem som tidslinje.
  function timeline(noter){
    const lines = (noter||"").split("\n").map(l => l.trim()).filter(Boolean);
    if (!lines.length) return `<div class="empty" style="padding:0">Ingen noter endnu. Skriv den første ovenfor.</div>`;
    return `<ol class="tl">${lines.map(l => {
      const m = l.match(/^(\d{1,2}\/\d{1,2}(?:\/\d{2,4})?)\s*[:\-]?\s+(.*)$/);
      return m ? `<li><span class="d">${esc(m[1])}</span><span>${esc(m[2])}</span></li>` : `<li><span class="d"></span><span>${esc(l)}</span></li>`;
    }).join("")}</ol>`;
  }

  function noteBox(placeholder, label){
    return `<section class="panel">
      <label class="sec" for="fnote">Notér</label>
      <textarea id="fnote" placeholder="${esc(placeholder)}"></textarea>
      <div class="acts"><button class="btn primary" type="button" data-note>${esc(label)}</button><span class="status" id="fst"></span></div>
    </section>`;
  }

  function flashHtml(){ return flash ? `<div class="flash ${flash.err?"err":""}">${esc(flash.text)}</div>` : ""; }

  // ---------- Fokuskort ----------
  function renderFocus(){
    const [kind, id] = focus.split(":");
    const backTo = (TABS.find(t => t[0]===tab)||TABS[0])[1];
    const back = `<button class="back" type="button" data-back>← Tilbage til ${esc(backTo)}</button>`;

    if (kind === "p"){
      const p = data.p.find(x => x.id === id);
      if (!p){ focus = null; return renderList(); }
      const people = data.pe.filter(x => p.vid && x.vid === p.vid);
      const others = data.p.filter(q => p.vid && q.vid === p.vid && q.id !== p.id);
      const related = people.map(personRow).concat(others.map(projRow));
      return `<div class="focus">${back}
        <header>
          <div class="eyebrow">${STAGES[p.stage]||esc(p.stage)}${p.velatir?" · Velatir":""}</div>
          <h2 class="fname">${esc(projName(p))}</h2>
          <div class="fsub">${p.kontaktperson?`<span>${esc(p.kontaktperson.trim())}</span>`:""}<span>${esc(p.produkt)}</span>${p.vaerdi?`<span class="mono">${kr(p.vaerdi)}</span>`:""}</div>
        </header>
        ${flashHtml()}
        <div class="fgrid">
          <div class="fmain">
            <section class="panel">
              <div class="sec">Næste skridt</div>
              <p class="bignext ${p.naeste_skridt?"":"none"}">${esc(p.naeste_skridt || "Intet næste skridt endnu")}</p>
              <div>${whenChip(p.naeste_skridt_dato)}</div>
              <div class="acts"><span class="lbl">Flyt til</span>
                <button class="btn" type="button" data-move="1">I morgen</button>
                <button class="btn" type="button" data-move="3">+3 dage</button>
                <button class="btn" type="button" data-move="7">+1 uge</button>
                <button class="btn" type="button" data-move="14">+2 uger</button>
              </div>
            </section>
            ${noteBox("Fx: Kasper har budget fra januar", "Gem note")}
            <section><div class="ghead"><h2>Historik</h2><small>nyeste øverst</small></div>${timeline(p.noter)}</section>
          </div>
          <aside class="fside">
            <section class="panel"><div class="sec">Kontakt</div>${contact(p.email, p.mobilnummer)}</section>
            ${group("Hos samme firma", related, {empty:"Ingen andre personer eller projekter endnu."})}
          </aside>
        </div>
      </div>`;
    }

    const x = data.pe.find(y => y.id === id);
    if (!x){ focus = null; return renderList(); }
    const projs = data.p.filter(q => x.vid && q.vid === x.vid);
    const colleagues = data.pe.filter(y => x.vid && y.vid === x.vid && y.id !== x.id);
    return `<div class="focus">${back}
      <header>
        <div class="eyebrow">${KAT[x.kategori]||esc(x.kategori)}</div>
        <h2 class="fname">${esc(x.navn)}</h2>
        <div class="fsub">${x.firmanavn?`<span>${esc(x.firmanavn.trim())}</span>`:""}<span>${x.sidste_kontakt?`Talt sammen ${dk(x.sidste_kontakt)}`:"Ingen kontakt registreret"}</span></div>
      </header>
      ${flashHtml()}
      <div class="fgrid">
        <div class="fmain">
          ${noteBox("Hvad talte I om? Familie, interesser, hvad du lovede", "Gem og sæt talt sammen til i dag")}
          <section><div class="ghead"><h2>Det du ved om ${esc(x.navn.split(" ")[0])}</h2><small>nyeste øverst</small></div>${timeline(x.noter)}</section>
        </div>
        <aside class="fside">
          <section class="panel"><div class="sec">Kontakt</div>${contact(x.email, x.mobilnummer)}</section>
          ${projs.length ? group("Projekter", projs.map(projRow)) : ""}
          ${colleagues.length ? group("Kolleger", colleagues.map(personRow)) : ""}
        </aside>
      </div>
    </div>`;
  }

  // ---------- Lister ----------
  function renderList(){
    const t = today(), w = addDays(t,6);
    if (tab === "idag"){
      const live = projects(p => p.stage !== "tabt");
      const over = live.filter(p => p.naeste_skridt_dato && p.naeste_skridt_dato < t).sort(byDate);
      const soon = live.filter(p => p.naeste_skridt_dato && p.naeste_skridt_dato >= t && p.naeste_skridt_dato <= w).sort(byDate);
      const nodate = live.filter(p => ACTIVE.includes(p.stage) && !p.naeste_skridt_dato);
      const tasks = data.o.filter(o => matches(o.tekst,o.person,o.firma)).sort((a,b)=>(a.forfald||"9999")<(b.forfald||"9999")?-1:1);
      return `<div class="grid split">
        <div>${group("Forfaldent", over.map(projRow), {warn:over.length>0, empty:"Intet forfaldent. Du er ajour."})}
             ${group("De næste 7 dage", soon.map(projRow), {empty:"Ingen næste skridt den kommende uge."})}</div>
        <div>${group("Små løfter", tasks.map(taskRow), {empty:"Ingen åbne løfter."})}
             ${group("Aktive uden dato", nodate.map(projRow), {empty:"Alle aktive leads har en dato."})}</div>
      </div>`;
    }
    if (tab === "pipeline"){
      const cols = ["tilbud","dialog","lead","kunde"].map(s => {
        const rows = projects(p => p.stage === s).sort(byDate);
        const sum = rows.reduce((a,p)=>a+(p.vaerdi||0),0);
        return group(`${STAGES[s]}${sum?` <span class="mono" style="font-size:13px;color:var(--muted);font-weight:400">· ${kr(sum)}</span>`:""}`, rows.map(projRow));
      });
      const lost = data.p.filter(p => p.stage === "tabt").length;
      return `<div class="grid split"><div>${cols[0]}${cols[1]}</div><div>${cols[2]}${cols[3]}<div class="empty">${lost} tabte projekter er skjult.</div></div></div>`;
    }
    if (tab === "netvaerk"){
      const rows = projects(p => p.stage === "netvaerk").sort(byDate).map(projRow);
      const ppl = data.pe.filter(x => x.kategori === "netvaerk" && matches(x.navn,x.firmanavn,x.noter)).map(personRow);
      return `<div class="grid split"><div>${group("Leadgeneratorer", rows, {empty:"Ingen i netværket endnu."})}</div><div>${group("Personer i netværket", ppl, {empty:"Indtal en note om en person, så dukker de op her."})}</div></div>`;
    }
    if (tab === "velatir"){
      return `<div class="grid">${group("Leads der peger på Velatir", projects(p => p.velatir).sort(byDate).map(projRow), {empty:"Ingen leads er markeret til Velatir endnu."})}</div>`;
    }
    const ppl = data.pe.filter(x => (showPrivate || x.kategori !== "privat") && matches(x.navn,x.firmanavn,x.noter))
      .sort((a,b)=>(b.sidste_kontakt||"")>(a.sidste_kontakt||"")?1:-1).map(personRow);
    const hidden = data.pe.filter(x => x.kategori === "privat").length;
    return `<label class="toggle"><input type="checkbox" id="priv" ${showPrivate?"checked":""}> Vis private kontakter (${hidden})</label>
      <div class="grid">${group("Personer", ppl, {empty:"Ingen personer endnu. Indtal en note efter dit næste møde."})}</div>`;
  }

  function render(){
    if (!data) return;
    renderPulse(); renderTabs();
    $("#q").hidden = !!focus;
    $("#main").innerHTML = focus ? renderFocus() : renderList();
  }

  function openFocus(key){ if (!focus) listScroll = window.scrollY; focus = key; flash = null; render(); window.scrollTo(0,0); }
  function closeFocus(){ focus = null; flash = null; render(); window.scrollTo(0, listScroll); }

  // Skrivninger: kun efter et klik, ingen automatiske genforsøg
  async function write(query, okText){
    const st = document.getElementById("fst");
    if (st){ st.className = "status"; st.textContent = "Gemmer…"; }
    try { await sql(query); flash = okText ? {text: okText} : null; await load(); }
    catch(e){
      const msg = errText(e) + (e && (e.code==="server_unavailable"||e.code==="upstream_error") ? " Tjek om det blev gemt, før du prøver igen." : "");
      if (st){ st.className = "status err"; st.textContent = msg; } else { flash = {text: msg, err: true}; render(); }
    }
  }

  document.addEventListener("click", async ev => {
    const el = ev.target;
    const tb = el.closest("[data-tab]");
    if (tb){ tab = tb.dataset.tab; focus = null; flash = null; try{localStorage.setItem("puls.tab",tab);}catch(e){} render(); window.scrollTo(0,0); return; }
    if (el.closest("[data-back]")){ closeFocus(); return; }
    const cp = el.closest("[data-copy]");
    if (cp){ const v = cp.dataset.copy; try { await navigator.clipboard.writeText(v); cp.textContent = "Kopieret"; } catch(e){ const s = cp.previousElementSibling; const r = document.createRange(); r.selectNodeContents(s); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); } return; }
    const dn = el.closest("[data-done]");
    if (dn){ const id = dn.dataset.done; if (!isId(id)) return; dn.disabled = true; dn.textContent = "Gemmer…"; write(`update opgaver set faerdig=true, faerdig_dato='${today()}' where id='${id}'`, "Løftet er markeret som færdigt"); return; }
    if (focus){
      const [kind, uuid] = focus.split(":");
      if (!isId(uuid)) return;
      const mv = el.closest("[data-move]");
      if (mv && kind === "p"){ const d = addDays(today(), +mv.dataset.move); write(`update projekter set naeste_skridt_dato='${d}' where id='${uuid}'`, "Næste skridt er flyttet til " + dk(d)); return; }
      if (el.closest("[data-note]")){
        const ta = document.getElementById("fnote"), txt = (ta.value||"").trim();
        if (!txt){ const s = document.getElementById("fst"); s.className="status err"; s.textContent="Skriv noten først."; ta.focus(); return; }
        const line = lit(stamp() + ": " + txt);
        const q = kind === "p"
          ? `update projekter set noter = ${line} || coalesce(E'\\n' || noter, '') where id='${uuid}'`
          : `update personer set noter = ${line} || coalesce(E'\\n' || noter, ''), sidste_kontakt='${today()}' where id='${uuid}'`;
        write(q, "Noten er gemt");
        return;
      }
    }
    const row = el.closest("[data-focus]");
    if (row){ const [k, u] = row.dataset.focus.split(":"); if (isId(u)) openFocus(row.dataset.focus); }
  });

  document.addEventListener("keydown", ev => {
    if (ev.key === "Escape" && focus && !ev.target.matches("textarea")){ closeFocus(); return; }
    if ((ev.key === "Enter" || ev.key === " ") && ev.target.matches(".row[data-focus]")){ ev.preventDefault(); ev.target.click(); }
  });
  document.addEventListener("change", ev => { if (ev.target.id === "priv"){ showPrivate = ev.target.checked; render(); } });
  $("#q").addEventListener("input", ev => { query = ev.target.value.trim(); render(); });
  $("#refresh").addEventListener("click", () => { retried = false; load(); });

  const useMcp = (window.claude && typeof window.claude.use === "function") ? window.claude.use("mcp") : Promise.resolve(null);
  useMcp.then(ns => {
    mcp = ns;
    if (!mcp){ $("#main").innerHTML = ""; const b = $("#banner"); b.textContent = "Siden kan ikke hente data i denne visning. Åbn den i claude.ai, hvor din Supabase-forbindelse er tilgængelig."; b.hidden = false; return; }
    load();
  });
})();
</script>
