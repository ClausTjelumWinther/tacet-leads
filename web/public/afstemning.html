<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F5F0EB">
<meta name="robots" content="noindex">
<title>Tacet · afstemning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@75..100,400..600&family=Instrument+Serif:ital@0;1&display=swap">
<style>
:root { --sand: #F5F0EB; --ink: #174A42; --deep: #0E2E29; --muted: #5E756F; --line: rgba(23,74,66,.16); --white: #fff; --accent: #3269A0; }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--sand); color: var(--ink); font-family: 'Instrument Sans', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
body { display: flex; flex-direction: column; min-height: 100dvh; padding: calc(env(safe-area-inset-top) + 18px) max(18px, env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 18px) max(18px, env(safe-area-inset-left)); }
header { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--muted); }
header b { font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: 20px; color: var(--ink); }
main { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 22px; padding-block: 24px; }
.step { font-size: 13px; color: var(--accent); letter-spacing: .03em; }
h1 { margin: 0; font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: 34px; line-height: 1.08; text-wrap: balance; }
.opts { display: grid; gap: 10px; }
.opts button { appearance: none; text-align: left; font: inherit; font-size: 18px; line-height: 1.3; padding: 16px 18px; border-radius: 14px; border: 0.5px solid var(--line); background: var(--white); color: var(--ink); touch-action: manipulation; }
.opts button.on { background: var(--ink); color: var(--sand); border-color: var(--ink); }
.word { display: grid; gap: 10px; }
.word input { font: inherit; font-size: 22px; padding: 16px 18px; border-radius: 14px; border: 0.5px solid var(--line); background: var(--white); color: var(--ink); width: 100%; }
.word button { appearance: none; font: inherit; font-size: 18px; padding: 16px; border-radius: 14px; border: 0; background: var(--ink); color: var(--sand); }
.thanks { font-size: 16px; color: var(--muted); min-height: 1.5em; }
.wait p { margin: 0; color: var(--muted); font-size: 17px; line-height: 1.5; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<header><b>Tacet</b><span id="st">Forbinder …</span></header>
<main>
  <div id="wait" class="wait"><h1>Velkommen</h1><p id="wmsg">Spørgsmålet kommer om lidt. Kig op på skærmen.</p></div>
  <div id="q" hidden>
    <div class="step" id="qn"></div>
    <h1 id="qt"></h1>
    <div class="opts" id="opts"></div>
    <form class="word" id="word" hidden><input id="w" maxlength="24" autocomplete="off" autocapitalize="off" enterkeyhint="send" placeholder="Ét ord"><button type="submit">Send</button></form>
    <p class="thanks" id="thx"></p>
  </div>
</main>
<script>
(() => {
  const SB_URL = 'https://vdebqppfkvcqjytbuhny.supabase.co';
  const SB_KEY = 'sb_publishable_yyHRFNi3HMzAgLyXMK_GGQ_DdAjVLAE';
  const $ = id => document.getElementById(id);
  const code = (location.hash || '').replace('#', '').trim();
  if (!/^[a-z0-9]{8,32}$/i.test(code)) { $('st').textContent = ''; $('wmsg').textContent = 'Scan QR-koden på skærmen for at være med.'; return; }
  const me = (() => { try { let v = localStorage.getItem('tacet-poll-id'); if (!v) { v = Math.random().toString(36).slice(2, 12); localStorage.setItem('tacet-poll-id', v); } return v; } catch (e) { return Math.random().toString(36).slice(2, 12); } })();
  const KEY = 'tacet-poll-' + code;
  let answers = {};
  try { answers = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}
  const keep = () => { try { localStorage.setItem(KEY, JSON.stringify(answers)); } catch (e) {} };
  let send = () => {}, curQ = null;

  function show(q) {
    curQ = q;
    if (!q || q.i < 0) { $('q').hidden = true; $('wait').hidden = false; return; }
    $('wait').hidden = true; $('q').hidden = false;
    $('qn').textContent = 'Spørgsmål ' + (q.i + 1) + ' af ' + q.n;
    $('qt').textContent = q.q;
    const mine = answers[q.i];
    $('thx').textContent = mine != null ? 'Tak. Du kan stadig ændre dit svar.' : '';
    if (q.type === 'ord') {
      $('opts').replaceChildren(); $('word').hidden = false;
      if (mine && document.activeElement !== $('w')) $('w').value = mine;
    } else {
      $('word').hidden = true;
      $('opts').replaceChildren(...q.options.map((o, k) => {
        const b = document.createElement('button'); b.type = 'button'; b.textContent = o;
        b.classList.toggle('on', mine === k);
        b.onclick = () => vote(k);
        return b;
      }));
    }
  }
  function vote(v) {
    if (!curQ) return;
    answers[curQ.i] = v; keep();
    send({ id: me, i: curQ.i, v });
    show(curQ);
    if (navigator.vibrate) try { navigator.vibrate(15); } catch (e) {}
  }
  $('word').addEventListener('submit', e => {
    e.preventDefault();
    const w = $('w').value.trim().split(/\s+/)[0] || '';
    if (!w) return;
    $('w').value = w; $('w').blur(); vote(w.slice(0, 24));
  });

  const s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js';
  s.onerror = () => { $('st').textContent = 'Ingen forbindelse'; };
  s.onload = () => {
    const sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: false } });
    const ch = sb.channel('tacet-poll-' + code, { config: { broadcast: { self: false } } });
    ch.on('broadcast', { event: 'q' }, ({ payload }) => { $('st').textContent = 'Forbundet'; show(payload); });
    ch.on('broadcast', { event: 'sync' }, () => { Object.entries(answers).forEach(([i, v]) => send({ id: me, i: +i, v })); });
    ch.on('broadcast', { event: 'end' }, () => { show(null); $('wmsg').textContent = 'Tak for dine svar. Kig op på skærmen.'; });
    ch.subscribe(st => {
      if (st === 'SUBSCRIBED') { $('st').textContent = 'Forbundet'; ch.send({ type: 'broadcast', event: 'hello', payload: { id: me } }); Object.entries(answers).forEach(([i, v]) => send({ id: me, i: +i, v })); }
      else if (st === 'CHANNEL_ERROR' || st === 'TIMED_OUT') $('st').textContent = 'Forbinder igen …';
    });
    send = p => ch.send({ type: 'broadcast', event: 'vote', payload: p });
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') ch.send({ type: 'broadcast', event: 'hello', payload: { id: me } }); });
  };
  document.head.appendChild(s);
})();
</script>
</body>
</html>
